<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Sayfa başlığı site.json / lang.json yüklendiğinde JavaScript tarafından atanır -->
    <title></title>
    <link rel="icon" id="site-favicon">
    <link rel="apple-touch-icon" id="site-touch-icon">
    <link rel="stylesheet" href="css/style.css?v=20261030-steam">
    <!-- Sinematik karanlık fantezi atmosferi için Google Fonts bağlantıları -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Üst Gezinme Çubuğu (Navigation Bar) -->
    <header class="site-header">
        <div class="header-container">
            <a href="#hero" class="site-logo" id="site-logo">
                <img id="brand-logo" alt="" width="40" height="40">
                <span id="brand-title" lang="en"></span>
            </a>

            <!-- Mobil Ekranlar İçin Menü Butonu -->
            <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Menüyü Aç veya Kapat">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>

            <!-- Gezinme Menüsü -->
            <nav class="site-nav" id="site-nav">
                <ul class="nav-links">
                    <li><a href="#hero" data-i18n="nav_home"></a></li>
                    <li><a href="#features" data-i18n="nav_features"></a></li>
                    <li><a href="#media" data-i18n="nav_media"></a></li>
                    <li><a href="#characters" data-i18n="nav_characters"></a></li>
                    <li><a href="#lore" data-i18n="nav_lore"></a></li>
                    <li><a href="#requirements" data-i18n="nav_requirements"></a></li>
                    <li><a href="#patches" data-i18n="nav_patches"></a></li>
                    <li><a href="#contact" data-i18n="nav_contact"></a></li>
                </ul>

                <!-- Dil Değiştirici Buton (TR / EN) -->
                <div class="language-switcher">
                    <button id="lang-btn" class="lang-toggle-btn" type="button" aria-label="Dili Değiştir">
                        <!-- Dil göstergesi JavaScript ile doldurulur -->
                    </button>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <!-- 1. Bölüm: Hero (Giriş / Karşılama Alanı) -->
        <section id="hero" class="hero-section">
            <div class="hero-backdrop"><img id="hero-image" alt="" fetchpriority="high"></div>
            <div class="hero-overlay"></div>
            <div class="hero-layout container">
                <div class="hero-content">
                    <span class="hero-kicker" data-i18n="hero_kicker"></span>
                    <h1 class="hero-title" id="hero-game-title" lang="en"></h1>
                    <p class="hero-description" data-i18n="hero_description"></p>
                    <div class="hero-actions">
                        <a id="steam-wishlist" class="btn btn-primary" target="_blank" rel="noopener noreferrer" data-i18n="steam_wishlist"></a>
                        <a id="steam-demo" class="btn btn-secondary" target="_blank" rel="noopener noreferrer" data-i18n="steam_demo"></a>
                    </div>
                    <a href="#features" class="hero-explore" data-i18n="hero_explore"></a>
                </div>
                <div class="trailer-card">
                    <div class="trailer-card-top"><span data-i18n="trailer_eyebrow"></span><span id="trailer-duration"></span></div>
                    <button id="trailer-trigger" class="trailer-trigger" type="button" aria-haspopup="dialog">
                        <img id="trailer-poster" alt="" fetchpriority="high">
                        <span class="play-orbit" aria-hidden="true"><span class="play-triangle"></span></span>
                        <span class="trailer-watch" data-i18n="trailer_watch"></span>
                    </button>
                    <div class="trailer-card-bottom"><span data-i18n="trailer_caption"></span><span class="trailer-dot" aria-hidden="true"></span></div>
                </div>
            </div>
        </section>

        <!-- 2. Bölüm: Temel Özellikler (Steam Core Features) -->
        <section id="features" class="section features-section">
            <div class="container">
                <div class="section-header">
                    <span class="section-kicker" data-i18n="features_eyebrow"></span>
                    <h2 class="section-title" data-i18n="features_title"></h2>
                    <p class="section-subtitle" data-i18n="features_subtitle"></p>
                </div>
                <div class="features-grid" id="features-container"></div>
            </div>
        </section>

        <!-- 3. Bölüm: Oynanış Galerisi -->
        <section id="media" class="section media-section">
            <div class="container">
                <div class="media-heading">
                    <div>
                        <span class="section-kicker" data-i18n="gallery_eyebrow"></span>
                        <h2 class="section-title" data-i18n="gallery_title"></h2>
                    </div>
                    <p data-i18n="gallery_subtitle"></p>
                </div>
                <div id="gameplay-gallery" class="gameplay-gallery"></div>
            </div>
        </section>

        <!-- 4. Bölüm: Karakterler -->
        <section id="characters" class="section characters-section">
            <div class="container">
                <div class="section-header">
                    <h2 class="section-title" data-i18n="characters_title"></h2>
                    <p class="section-subtitle" data-i18n="characters_subtitle"></p>
                </div>
                <div class="characters-grid" id="characters-container"></div>
            </div>
        </section>

        <!-- 5. Bölüm: Hikâye (The Lore) -->
        <section id="lore" class="section lore-section">
            <div class="container">
                <div class="lore-card">
                    <div class="lore-header">
                        <span class="section-kicker" data-i18n="lore_eyebrow"></span>
                        <h2 class="section-title" data-i18n="lore_title"></h2>
                    </div>
                    <div class="lore-content">
                        <p class="lore-paragraph" data-i18n="lore_p1"></p>
                        <p class="lore-paragraph" data-i18n="lore_p2"></p>
                        <blockquote class="lore-quote" data-i18n="lore_quote"></blockquote>
                    </div>
                </div>
            </div>
        </section>

        <!-- 6. Bölüm: Steam Eyleme Çağrı Şeridi (CTA Banner) -->
        <section class="steam-cta-banner">
            <div class="container cta-banner-inner">
                <div class="cta-banner-text">
                    <h3 class="cta-banner-title" data-i18n="cta_banner_title"></h3>
                    <p class="cta-banner-subtitle" data-i18n="cta_banner_subtitle"></p>
                </div>
                <div class="cta-banner-actions">
                    <a id="cta-wishlist" class="btn btn-primary" target="_blank" rel="noopener noreferrer" data-i18n="cta_banner_wishlist"></a>
                    <a id="cta-demo" class="btn btn-secondary" target="_blank" rel="noopener noreferrer" data-i18n="cta_banner_demo"></a>
                </div>
            </div>
        </section>

        <!-- 7. Bölüm: Sistem Gereksinimleri -->
        <section id="requirements" class="section requirements-section">
            <div class="container">
                <div class="section-header">
                    <span class="section-kicker" data-i18n="req_eyebrow"></span>
                    <h2 class="section-title" data-i18n="req_title"></h2>
                    <p class="section-subtitle" data-i18n="req_subtitle"></p>
                </div>
                <div class="requirements-container" id="requirements-container"></div>
            </div>
        </section>

        <!-- 8. Bölüm: Yama Notları -->
        <section id="patches" class="section patches-section">
            <div class="container">
                <div class="section-header">
                    <h2 class="section-title" data-i18n="patches_title"></h2>
                    <p class="section-subtitle" data-i18n="patches_subtitle"></p>
                </div>
                <div class="patches-container" id="patches-container"></div>
            </div>
        </section>

        <!-- 9. Bölüm: İletişim & Sosyal Medya -->
        <section id="contact" class="section contact-section">
            <div class="container">
                <div class="section-header">
                    <h2 class="section-title" data-i18n="contact_title"></h2>
                    <p class="section-subtitle" data-i18n="contact_subtitle"></p>
                </div>

                <div class="contact-card">
                    <div class="contact-email-wrapper">
                        <span class="contact-label" data-i18n="contact_email_label"></span>
                        <a href="#" id="contact-email" class="contact-link"></a>
                    </div>

                    <div class="social-wrapper">
                        <span class="contact-label" data-i18n="contact_social_label"></span>
                        <div class="social-links" id="social-links-container"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Alt Bilgi (Footer) -->
    <footer class="site-footer">
        <div class="container footer-content">
            <p id="footer-copyright"></p>
            <p class="footer-note" data-i18n="footer_rights"></p>
        </div>
    </footer>

    <dialog id="media-dialog" class="media-dialog" aria-labelledby="media-dialog-title">
        <div class="media-dialog-top"><h2 id="media-dialog-title"></h2><button id="media-close" type="button"></button></div>
        <video id="montage-player" controls playsinline preload="none" hidden></video>
        <img id="gallery-full-image" alt="" hidden>
        <div id="gallery-controls" class="gallery-controls" hidden><button id="gallery-previous" type="button"></button><span id="gallery-counter"></span><button id="gallery-next" type="button"></button></div>
        <p id="media-error" hidden></p>
    </dialog>

    <script src="js/main.js?v=20261030-cta"></script>
</body>
</html>
